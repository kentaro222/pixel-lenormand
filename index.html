<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>PIXEL LENORMAND v0.9</title><style>
:root{--bg:#f5f0e5;--panel:#fffcf5;--line:#d8d1bd;--text:#243d33;--muted:#626b5b;--accent:#286047;--gold:#a17a33;--card:#f4e8ca;--card-line:#ad8745;--shadow:rgba(50,65,43,.12)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}header,main{max-width:1024px;margin:auto;padding:18px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid var(--line)}h1{font-size:22px;margin:3px 0}h2{font-size:18px}p{color:var(--muted);line-height:1.6}.muted{color:var(--muted);font-size:13px}.eyebrow{letter-spacing:.12em;color:var(--accent);font-size:11px}nav{display:flex;gap:8px;flex-wrap:wrap}button{cursor:pointer;border:1px solid var(--line);background:#eeeadc;color:var(--text);padding:10px 14px;border-radius:8px;font:inherit}button.active,button.primary{background:var(--accent);color:#fffdf4; border-color:var(--accent);font-weight:700}button:focus-visible{outline:3px solid var(--gold);outline-offset:4px}.screen{display:none}.screen.active{display:block}.surface{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;margin-top:20px}.cardrow{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;margin:24px 0}.card{width:158px;aspect-ratio:3/4;background:var(--card);border:6px solid var(--card-line);box-shadow:0 6px 0 var(--shadow);border-radius:7px;color:var(--text);text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:12px 6px}.card .number{align-self:flex-start;font-size:13px;font-weight:800}.card .symbol{font-size:61px;line-height:1.2;height:70px;display:grid;place-items:center;image-rendering:pixelated}.card img{width:96px;height:96px;object-fit:contain;image-rendering:pixelated}.card .name{font-size:17px;font-weight:800}.card .en{font-size:11px}.card.small{width:112px;border-width:4px;padding:7px 3px;box-shadow:0 3px 0 var(--shadow)}.card.small .symbol{font-size:38px;height:51px}.card.small img{width:52px;height:52px}.card.small .name{font-size:13px}.card.small .en{font-size:10px}.card.small .number{font-size:11px}.card.clickable{cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:12px;justify-items:center}.interpret{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}.interpret strong{color:var(--accent)}.actions{display:flex;gap:10px;flex-wrap:wrap}.result{min-height:54px}@media(max-width:600px){header{flex-direction:column;align-items:flex-start}.card{width:130px}.card .symbol{font-size:48px}.cardrow{gap:8px}.surface{padding:14px}.card.small{width:100px}.grid{grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}}
:root{--sprite-url:url("./lenormand_sprites.png")}

.card{position:relative;justify-content:space-between;gap:3px;padding:10px 8px 12px}
.card .number{align-self:center;font-size:17px;line-height:1.2;font-weight:800;margin-bottom:4px}
.card .symbol{height:auto;flex:1;width:100%;display:flex;align-items:center;justify-content:center}
.sprite{--sprite-size:128px;display:block;width:128px;height:128px;flex-shrink:0;background-image:var(--sprite-url);background-repeat:no-repeat;background-size:768px 768px;background-position:calc(var(--col) * -128px) calc(var(--row) * -128px);image-rendering:pixelated}
.card .name{font-size:17px}.card .en{font-size:11px;letter-spacing:.035em}
.card.small .number{align-self:center;font-size:12px}
.card.small .symbol{height:auto}
.card.small .sprite{width:72px;height:72px;background-size:432px 432px;background-position:calc(var(--col) * -72px) calc(var(--row) * -72px)}
@media(max-width:600px){.card:not(.small) .sprite{width:98px;height:98px;background-size:588px 588px;background-position:calc(var(--col) * -98px) calc(var(--row) * -98px)}}

/* Cream, forest green and antique gold */
.version{display:inline-block;font-size:.55em;letter-spacing:.02em;color:var(--muted);vertical-align:middle}
body{background:radial-gradient(ellipse at top,#fffaf0 0%,var(--bg) 65%);min-height:100vh}
header{padding-top:32px;padding-bottom:24px;border-bottom:1px solid var(--line)}
h1{letter-spacing:.07em;color:var(--accent);margin:7px 0;font-size:24px}
h2{color:var(--accent);margin-top:0}
.eyebrow{color:#806125;font-weight:700;letter-spacing:.16em}
nav{background:#e9e5d7;border:1px solid var(--line);padding:5px;border-radius:12px}
nav button{background:transparent;border-color:transparent;font-size:14px}
button{transition:background .15s ease,box-shadow .15s ease;min-height:44px}
button:hover{background:#e1e6d8;border-color:#8a9b7c}
button.active:hover,button.primary:hover{background:#1d4b36;border-color:#1d4b36}
button.primary{box-shadow:0 3px 0 #d5d9c8}
.surface{margin-top:28px;padding:28px;border-top:3px solid var(--gold);box-shadow:0 10px 32px rgba(63,64,36,.06)}
#drawn{min-height:230px;align-items:center;padding:24px 12px;background:#eeeadd;border:1px dashed #c8c3ac;border-radius:12px}
.card .number{color:#72531e}
.card .en{color:#626044}
.card.clickable:hover{border-color:#6b855d;box-shadow:0 3px 0 #bbc5a8}
.card.clickable:focus-visible{outline:3px solid var(--accent);outline-offset:4px}
.interpret{background:#f1f2e7;border:1px solid #d9dfcc;border-left:3px solid var(--gold);border-radius:8px;padding:16px}
.interpret p{margin-bottom:0}

@media(max-width:600px){header{padding-top:22px}h1{font-size:21px}.surface{padding:18px;margin-top:18px}#drawn{min-height:210px;padding:20px 6px}nav{width:100%}nav button{flex:1}}
@media(prefers-reduced-motion:reduce){button{transition:none}}

/* Keep multi-card draws in one ordered row on phones. */
header{padding-top:18px;padding-bottom:16px}
h1{font-size:22px;letter-spacing:.035em}
.cardrow{gap:12px}
#drawn.spread{display:grid;grid-template-columns:repeat(var(--draw-count),minmax(0,1fr));align-items:start}
.draw-slot{min-width:0;display:flex;flex-direction:column;align-items:center;gap:10px;animation:card-reveal .55s cubic-bezier(.2,.7,.2,1) both;animation-delay:var(--delay)}
.draw-order{font-size:12px;font-weight:700;color:var(--accent);text-align:center}
#drawn .card{max-width:100%}
@keyframes card-reveal{from{opacity:0;transform:translateY(18px) scale(.92) rotateY(45deg)}to{opacity:1;transform:translateY(0) scale(1) rotateY(0)}}
@media(max-width:600px){
 header,main{padding-left:12px;padding-right:12px}
 header{gap:12px}h1{font-size:20px;margin:0}
 .surface{padding:14px;margin-top:14px}
 .surface>p{font-size:13px;line-height:1.7}
 .actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
 .actions button{min-height:48px;font-weight:700;padding:10px 8px}
 #reset{grid-column:1/-1;min-height:44px;background:transparent}
 #drawn{margin:18px 0;padding:18px 8px;min-height:220px}
 #drawn.spread{gap:6px;min-height:0}
 #drawn.spread .card{width:100%;border-width:3px;padding:7px 2px;gap:3px;aspect-ratio:auto;min-height:150px}
 #drawn.spread .number{font-size:12px;margin-bottom:0}
 #drawn.spread .name{font-size:11px;letter-spacing:-.03em}
 #drawn.spread .en{font-size:9px;letter-spacing:0}
 #drawn.spread .sprite{width:60px;height:60px;background-size:360px 360px;background-position:calc(var(--col) * -60px) calc(var(--row) * -60px)}
 .draw-order{font-size:10px;white-space:nowrap}
 .interpret{padding:12px;font-size:14px}
 .grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 6px}
 .card.small{width:100%;max-width:112px;padding:7px 2px;border-width:3px}
 .card.small .name{font-size:11px}.card.small .en{font-size:9px}
 .card.small .sprite{width:60px;height:60px;background-size:360px 360px;background-position:calc(var(--col) * -60px) calc(var(--row) * -60px)}
}
@media(prefers-reduced-motion:reduce){.draw-slot{animation:none}}

#card-dialog{width:min(420px,calc(100% - 32px));max-height:85dvh;overflow:auto;border:1px solid var(--line);border-top:3px solid var(--gold);border-radius:16px;background:var(--panel);color:var(--text);padding:20px;box-shadow:0 16px 60px #0003}
#card-dialog::backdrop{background:rgba(24,40,30,.5)}
#card-dialog form{display:flex;justify-content:flex-end;margin-bottom:12px}
#detail-title{font-size:17px;line-height:1.6}
#detail-card{display:flex;justify-content:center;margin:20px 0}
#detail-meaning{text-align:center;line-height:1.8}
body:has(#card-dialog[open]){overflow:hidden}
</style></head><body>
<header><div><h1>PIXEL LENORMAND <small class="version">v0.9</small></h1></div><nav><button class="active" data-tab="draw">占う</button><button data-tab="library">カード図鑑</button></nav></header>
<main><section id="draw" class="screen active" aria-label="占う"><div class="surface"><div class="actions"><button class="primary" id="one">1枚引く</button><button id="two">2枚引く</button><button id="three">3枚引く</button><button id="reset">リセット</button></div><div id="drawn" class="cardrow" aria-live="polite"><div class="muted">カードを引くボタンを押してください</div></div><div id="keywords" aria-live="polite"></div></div></section><section id="library" class="screen" aria-label="カード図鑑"><div class="surface"><div id="grid" class="grid"></div></div></section></main><dialog id="card-dialog" aria-labelledby="detail-title"><form method="dialog"><button aria-label="閉じる">閉じる</button></form><h2 id="detail-title"></h2><div id="detail-card"></div><p id="detail-meaning"></p></dialog>
<script>
const rows=[
['騎士','Rider','🐎','知らせ・到来・動き'],['クローバー','Clover','🍀','小さな幸運・機会'],['船','Ship','🚢','旅・遠方・移動'],['家','House','🏠','家庭・安定・居場所'],['木','Tree','🌳','健康・成長・長期性'],['雲','Cloud','☁️','混乱・不透明さ'],['蛇','Snake','🐍','複雑さ・回り道'],['棺','Coffin','⚰️','終了・区切り・停止'],['花束','Bouquet','💐','贈り物・喜び・好意'],['鎌','Scythe','🌾','急な決断・切断'],['鞭','Whip','🪢','繰り返し・議論・衝突'],['鳥','Bird','🐦','会話・緊張・交流'],['子ども','Child','🧒','始まり・小ささ・純粋さ'],['狐','Fox','🦊','仕事・用心・策略'],['熊','Bear','🐻','力・権威・保護'],['星','Star','⭐','希望・目標・導き'],['コウノトリ','Stork','🕊️','変化・移行・改善'],['犬','Dog','🐕','友人・信頼・協力'],['塔','Tower','🏛️','組織・独立・距離'],['庭園','Garden','🌷','社交・集まり・公の場'],['山','Mountain','⛰️','障害・停滞・壁'],['道','Crossroads','🛤️','選択・複数の可能性'],['ネズミ','Mouse','🐭','損失・消耗・心配'],['ハート','Heart','❤️','愛情・好意・情熱'],['指輪','Ring','💍','約束・契約・つながり'],['本','Book','📖','知識・秘密・学習'],['手紙','Letter','✉️','文書・連絡・情報'],['紳士','Man','👨','男性人物・相談者'],['淑女','Woman','👩','女性人物・相談者'],['百合','Lily','🌸','成熟・調和・平穏'],['太陽','Sun','☀️','成功・活力・明るさ'],['月','Moon','🌙','感情・評価・直感'],['鍵','Key','🔑','解決・確信・重要性'],['魚','Fish','🐟','財産・商売・流れ'],['錨','Anchor','⚓','安定・仕事・継続'],['十字架','Cross','✝️','重荷・試練・責任']
].map((a,i)=>({id:i+1,name:a[0],en:a[1],icon:a[2],meaning:a[3]}));
const byId=id=>rows.find(c=>c.id===id);
function cardHTML(c,small=false){
 const i=c.id-1, col=i%6, row=Math.floor(i/6);
 return `<div class="card ${small?'small':''}" aria-label="${c.id} ${c.name}"><div class="number">${String(c.id).padStart(2,'0')}</div><div class="symbol"><span class="sprite" aria-hidden="true" style="--col:${col};--row:${row}"></span></div><div class="name">${c.name}</div><div class="en">${c.en}</div></div>`;
}
const drawn=document.getElementById('drawn'), keywords=document.getElementById('keywords');
function draw(n){let ids=rows.map(c=>c.id);for(let i=ids.length-1;i>0;i--){const arr=new Uint32Array(1);crypto.getRandomValues(arr);const j=arr[0]%(i+1);[ids[i],ids[j]]=[ids[j],ids[i]]}let chosen=ids.slice(0,n).map(byId);drawn.classList.toggle('spread',n>1);drawn.style.setProperty('--draw-count',n);drawn.innerHTML=chosen.map((c,i)=>`<div class="draw-slot" style="--delay:${i*160}ms"><div class="draw-order">${i+1}枚目</div>${cardHTML(c)}</div>`).join('');keywords.innerHTML='<div class="interpret"><strong>カードのキーワード</strong>'+chosen.map((c,i)=>`<p>${i+1}枚目 · ${c.name}：${c.meaning}</p>`).join('')+'</div>'}
document.getElementById('one').onclick=()=>draw(1);document.getElementById('two').onclick=()=>draw(2);document.getElementById('three').onclick=()=>draw(3);document.getElementById('reset').onclick=()=>{keywords.innerHTML='';drawn.classList.remove('spread');drawn.innerHTML='<div class="muted">カードを引くボタンを押してください</div>'};
const grid=document.getElementById('grid');grid.innerHTML=rows.map(c=>cardHTML(c,true).replace('class="card small"', `class="card small clickable" data-id="${c.id}" tabindex="0" role="button"`)).join('');const cardDialog=document.getElementById('card-dialog');
function detail(id){const c=byId(+id);document.getElementById('detail-title').textContent=`${String(c.id).padStart(2,'0')}. ${c.name} / ${c.en}`;document.getElementById('detail-card').innerHTML=cardHTML(c);document.getElementById('detail-meaning').textContent=c.meaning;cardDialog.showModal()}
cardDialog.addEventListener('click',e=>{if(e.target===cardDialog){const r=cardDialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)cardDialog.close()}});
grid.addEventListener('click',e=>{const el=e.target.closest('[data-id]');if(el)detail(el.dataset.id)});grid.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){const el=e.target.closest('[data-id]');if(el){e.preventDefault();detail(el.dataset.id)}}});
document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('active',s.id===b.dataset.tab))}));
</script></body></html>
