<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>PIXEL LENORMAND</title><style>
:root{--bg:#111827;--panel:#1f2937;--line:#354252;--text:#f4f2e9;--muted:#b8c2d0;--accent:#f5c978}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}header,main,footer{max-width:1024px;margin:auto;padding:18px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid var(--line)}h1{font-size:22px;margin:3px 0}h2{font-size:18px}p{color:var(--muted);line-height:1.6}.muted{color:var(--muted);font-size:13px}.eyebrow{letter-spacing:.12em;color:var(--accent);font-size:11px}nav{display:flex;gap:8px;flex-wrap:wrap}button{cursor:pointer;border:1px solid var(--line);background:#28364a;color:var(--text);padding:10px 14px;border-radius:8px;font:inherit}button.active,button.primary{background:var(--accent);color:#222; border-color:var(--accent);font-weight:700}button:focus-visible{outline:3px solid #8ab8ef}.screen{display:none}.screen.active{display:block}.surface{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;margin-top:20px}.cardrow{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;margin:24px 0}.card{width:158px;aspect-ratio:3/4;background:#ede5cd;border:6px solid #af8752;box-shadow:0 6px 0 #101b28;border-radius:7px;color:#292d31;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:12px 6px}.card .number{align-self:flex-start;font-size:13px;font-weight:800}.card .symbol{font-size:61px;line-height:1.2;height:70px;display:grid;place-items:center;image-rendering:pixelated}.card img{width:96px;height:96px;object-fit:contain;image-rendering:pixelated}.card .name{font-size:17px;font-weight:800}.card .en{font-size:11px}.card.small{width:112px;border-width:4px;padding:7px 3px;box-shadow:0 3px 0 #101b28}.card.small .symbol{font-size:38px;height:51px}.card.small img{width:52px;height:52px}.card.small .name{font-size:13px}.card.small .en{font-size:10px}.card.small .number{font-size:11px}.card.clickable{cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:12px;justify-items:center}.interpret{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}.interpret strong{color:var(--accent)}.actions{display:flex;gap:10px;flex-wrap:wrap}.result{min-height:54px}.hint{font-size:12px;margin:4px 0;color:#b6c1ce}footer{font-size:12px;color:var(--muted)}@media(max-width:600px){header{flex-direction:column;align-items:flex-start}.card{width:130px}.card .symbol{font-size:48px}.cardrow{gap:8px}.surface{padding:14px}.card.small{width:100px}.grid{grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}}
:root{--sprite-url:url("./lenormand_sprites.png")}

.card{position:relative;justify-content:space-between;gap:3px;padding:10px 8px 12px}
.card .number{align-self:center;font-size:17px;line-height:1.2;font-weight:800;margin-bottom:4px}
.card .symbol{height:auto;flex:1;width:100%;display:flex;align-items:center;justify-content:center}
.sprite{--sprite-size:128px;display:block;width:128px;height:128px;flex-shrink:0;background-image:var(--sprite-url);background-repeat:no-repeat;background-size:768px 768px;background-position:calc(var(--col) * -128px) calc(var(--row) * -128px);image-rendering:pixelated}
.card .name{font-size:17px}.card .en{font-size:11px;letter-spacing:.035em}
.card.small .number{align-self:center;font-size:12px}
.card.small .symbol{height:auto}
.card.small .sprite{width:72px;height:72px;background-size:432px 432px;background-position:calc(var(--col) * -72px) calc(var(--row) * -72px)}
@media(max-width:600px){.card:not(.small) .sprite{width:98px;height:98px;background-size:588px 588px;background-position:calc(var(--col) * -98px) calc(var(--row) * -98px)}}
</style></head><body>
<header><div><div class="eyebrow">PIXEL LENORMAND / v0.3</div><h1>PIXEL LENORMAND</h1><div class="muted">オリジナルの36枚ドット絵を使用</div></div><nav><button class="active" data-tab="draw">カードを引く</button><button data-tab="library">36枚の図鑑</button></nav></header>
<main><section id="draw" class="screen active"><div class="surface"><h2>今日のカードを引く</h2><p>重複しないカードをランダムに引きます。占いの結果は象徴を考えるためのヒントとして表示します。</p><div class="actions"><button class="primary" id="one">1枚引き</button><button id="three">3枚引き</button><button id="reset">リセット</button></div><div id="drawn" class="cardrow"><div class="muted">カードを引くボタンを押してください</div></div><div id="reading" class="result"></div></div></section><section id="library" class="screen"><div class="surface"><h2>36枚のカード図鑑</h2><p>カードを選ぶと意味を表示します。オリジナルのドット絵を番号順に表示しています。</p><div id="grid" class="grid"></div><div id="detail" class="interpret" aria-live="polite">カードを選択してください。</div></div></section></main><footer>試作版 / 画像は外部PNG（6×6のスプライトシート）を使用。番号はカード上部中央・トランプ表示なし。</footer>
<script>
const rows=[
['騎士','Rider','🐎','知らせ・到来・動き'],['クローバー','Clover','🍀','小さな幸運・機会'],['船','Ship','🚢','旅・遠方・移動'],['家','House','🏠','家庭・安定・居場所'],['木','Tree','🌳','健康・成長・長期性'],['雲','Clouds','☁️','混乱・不透明さ'],['蛇','Snake','🐍','複雑さ・回り道'],['棺','Coffin','⚰️','終了・区切り・停止'],['花束','Bouquet','💐','贈り物・喜び・好意'],['鎌','Scythe','🌾','急な決断・切断'],['鞭','Whip','🪢','繰り返し・議論・衝突'],['鳥','Birds','🐦','会話・緊張・交流'],['子ども','Child','🧒','始まり・小ささ・純粋さ'],['狐','Fox','🦊','仕事・用心・策略'],['熊','Bear','🐻','力・権威・保護'],['星','Stars','⭐','希望・目標・導き'],['コウノトリ','Stork','🕊️','変化・移行・改善'],['犬','Dog','🐕','友人・信頼・協力'],['塔','Tower','🏛️','組織・独立・距離'],['庭園','Garden','🌷','社交・集まり・公の場'],['山','Mountain','⛰️','障害・停滞・壁'],['道','Crossroads','🛤️','選択・複数の可能性'],['ネズミ','Mice','🐭','損失・消耗・心配'],['ハート','Heart','❤️','愛情・好意・情熱'],['指輪','Ring','💍','約束・契約・つながり'],['本','Book','📖','知識・秘密・学習'],['手紙','Letter','✉️','文書・連絡・情報'],['紳士','Man','👨','男性人物・相談者'],['淑女','Woman','👩','女性人物・相談者'],['百合','Lily','🌸','成熟・調和・平穏'],['太陽','Sun','☀️','成功・活力・明るさ'],['月','Moon','🌙','感情・評価・直感'],['鍵','Key','🔑','解決・確信・重要性'],['魚','Fish','🐟','財産・商売・流れ'],['錨','Anchor','⚓','安定・仕事・継続'],['十字架','Cross','✝️','重荷・試練・責任']
].map((a,i)=>({id:i+1,name:a[0],en:a[1],icon:a[2],meaning:a[3]}));
const byId=id=>rows.find(c=>c.id===id);
function cardHTML(c,small=false){
 const i=c.id-1, col=i%6, row=Math.floor(i/6);
 return `<div class="card ${small?'small':''}" aria-label="${c.id} ${c.name}"><div class="number">${String(c.id).padStart(2,'0')}</div><div class="symbol"><span class="sprite" aria-hidden="true" style="--col:${col};--row:${row}"></span></div><div class="name">${c.name}</div><div class="en">${c.en}</div></div>`;
}
const drawn=document.getElementById('drawn'), reading=document.getElementById('reading');
function draw(n){let ids=rows.map(c=>c.id);for(let i=ids.length-1;i>0;i--){const arr=new Uint32Array(1);crypto.getRandomValues(arr);const j=arr[0]%(i+1);[ids[i],ids[j]]=[ids[j],ids[i]]}let chosen=ids.slice(0,n).map(byId);drawn.innerHTML=chosen.map(c=>cardHTML(c)).join('');reading.innerHTML='<div class="interpret"><strong>引いたカードのキーワード</strong><p>'+chosen.map(c=>`${c.name}：${c.meaning}`).join('<br>')+'</p>'+(n===3?'<p class="hint">左から「過去・現在・これから」として読む仮の配置です。組み合わせの文章解釈は後で実装できます。</p>':'')+'</div>'}
document.getElementById('one').onclick=()=>draw(1);document.getElementById('three').onclick=()=>draw(3);document.getElementById('reset').onclick=()=>{drawn.innerHTML='<div class="muted">カードを引くボタンを押してください</div>';reading.innerHTML=''};
const grid=document.getElementById('grid');grid.innerHTML=rows.map(c=>cardHTML(c,true).replace('class="card small"', `class="card small clickable" data-id="${c.id}" tabindex="0" role="button"`)).join('');function detail(id){const c=byId(+id);document.getElementById('detail').innerHTML=`<strong>${String(c.id).padStart(2,'0')}. ${c.name} / ${c.en}</strong><p>${c.meaning}</p>`}grid.addEventListener('click',e=>{const el=e.target.closest('[data-id]');if(el)detail(el.dataset.id)});grid.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){const el=e.target.closest('[data-id]');if(el){e.preventDefault();detail(el.dataset.id)}}});
document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('active',s.id===b.dataset.tab))}));
</script></body></html>
